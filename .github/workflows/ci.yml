name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QUARTO_VERSION: "1.10.18"
  BUN_VERSION: "1.4.0"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked JavaScript tools
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Check source and unit tests
        # The ruff version is pinned in the package.json lint:py script.
        run: bun run check

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Render fixtures
        run: quarto render

      - name: Run publish pipeline against mocked wrangler
        run: bash tools/test_publish_integration.sh

      - name: Check staged deck serves beneath a path prefix
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          deck_dir="$(mktemp -d)"
          cp examples/showcase.qmd "$deck_dir/"
          cp -R examples/assets "$deck_dir/assets"
          ln -s "$PWD/_extensions" "$deck_dir/_extensions"
          (cd "$deck_dir" && quarto run \
            "$GITHUB_WORKSPACE/_extensions/altmejd-slides/tools/publish-cloudflare.ts" \
            --stage-only --host slides.example.test --slug showcase \
            --staging-dir "$deck_dir/staging")
          CHROME_PATH="$chrome_path" node tools/check_published_prefix.mjs \
            "$deck_dir/staging/public" showcase

      - name: Check near-cap code remains visible
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          CHROME_PATH="$chrome_path" bun run test:browser

      - name: Render PDF regression pair
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          python3 tools/render_revealjs_pdfs.py \
            --site-dir _site \
            --glob 'tests/fixtures/regression.html' \
            --output-dir output/pdf \
            --chrome-path "$chrome_path"

      - name: Upload PDF regression artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reveal-pdf-regression
          path: output/pdf/tests/fixtures/*.pdf
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Prepare public showcase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp _site/examples/showcase.html _site/examples/index.html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/examples

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
