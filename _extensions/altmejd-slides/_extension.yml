title: Altmejd Slides
author: Adam Altmejd Selder
version: 0.4.1
quarto-required: ">=1.10.0"
contributes:
  formats:
    revealjs:
      theme:
        - default
        - theme.scss
      center: false
      html-math-method: plain
      slide-number: c/t
      filters:
        - altmejd-slides.lua
        - slide-remote
      revealjs-plugins:
        - slide-remote
