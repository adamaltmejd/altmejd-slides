title: Altmejd Slides
author: Adam Altmejd Selder
version: 0.7.6
quarto-required: ">=1.10.0"
contributes:
  formats:
    revealjs:
      theme:
        - default
        - theme.scss
      center: false
      # Quarto emits scrollActivationWidth only when view is explicit.
      view: slide
      scroll-activation-width: 0
      html-math-method: plain
      slide-number: c/t
      filters:
        - altmejd-slides.lua
        - slide-remote
      revealjs-plugins:
        - slide-remote
